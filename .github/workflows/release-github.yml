name: Release to GitHub
run-name: release-github

on:
  workflow_dispatch:

env:
  PROJECT_PATH: installer/GitCompletion.wixproj
  MSI_PATH: installer/bin/Release/GitCompletion.msi

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read Version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version in package.json: $version"
          }

          if (Get-ChildItem .changeset/*.md | Where-Object Name -ne 'README.md') {
            throw 'Unreleased changesets found. Merge the "Version Packages" pull request first.'
          }

          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV

          Write-Host "Version: $version"
          Write-Host "Tag: v$version"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build MSI
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore

      - name: Verify MSI
        shell: pwsh
        run: |
          if (-not (Test-Path '${{ env.MSI_PATH }}')) {
            throw "MSI was not produced: ${{ env.MSI_PATH }}"
          }

          $file = Get-Item '${{ env.MSI_PATH }}'

          Write-Host "MSI: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

      - name: Replace Tag
        shell: bash
        run: |
          git tag -f "${TAG}"
          git push -f origin "${TAG}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Release Notes
        shell: pwsh
        run: |
          # Take this version's section out of the Changesets changelog.
          $notes = @()
          $found = $false

          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') {
              if ($found) { break }
              $found = $line.Trim() -eq "## $env:VERSION"
              continue
            }

            if ($found) { $notes += $line }
          }

          if (-not $found) {
            throw "CHANGELOG.md has no section for $env:VERSION"
          }

          ($notes -join "`n").Trim() | Set-Content release-notes.md -Encoding utf8

      - name: Replace Release
        shell: bash
        run: |
          gh release delete "${TAG}" --yes 2>/dev/null || true

          gh release create "${TAG}" \
            "${MSI_PATH}" \
            --title "GitCompletion ${TAG}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: pwsh
        run: |
          @"
          ## Release

          - **Version:** ${{ env.VERSION }}
          - **Tag:** ${{ env.TAG }}
          - **MSI:** `${{ env.MSI_PATH }}
          "@ >> $env:GITHUB_STEP_SUMMARY
